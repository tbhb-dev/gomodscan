tag_prefix = "v"

# No pre_bump_hooks: gomodscan carries no version literal for a release to
# rewrite. The binary's Version, Commit and Date arrive through ldflags at
# build time (.devtools/scripts/go-ldflags.sh), and apm.yml's version
# describes the local agent manifest rather than a published package.

[changelog]
path = "CHANGELOG.md"
template = ".cog/changelog.tera"
remote = "github.com"
repository = "gomodscan"
owner = "tbhb-dev"
authors = [{ username = "tbhb", signature = "Tony Burns" }]

[commit_types]
chore = { omit_from_changelog = true }
test = { omit_from_changelog = true }
