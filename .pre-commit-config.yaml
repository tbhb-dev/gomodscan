---
# SPDX-License-Identifier: Apache-2.0
# Copyright Tony Burns

# Git hooks for this clone, installed by `tbhbdev alpha install`. The lint
# and format hooks call the Bazel-pinned tools through the bazel_env shims in
# .bazel_env/bin (`bazel run //:bazel_env` builds them), never `bazel run`, so
# a running build's server lock can't stall a commit. They are the fast per-file
# subset; `bazel test //...` runs every gate, whole-tree ones included. The
# pre-push stage runs the cspell and Vale targets.
default_stages: [pre-commit]

# Never touch Vale's synced style packages, build output, scratch work, agent
# worktrees, or test fixtures (failure-proof fixtures are
# deliberately malformed).
exclude: ^(\.vale/(Google|write-good|proselint|ai-tells.*)/|\.bazel-.*/|bazel-.*/|tmp/|\.worktrees/|(.*/)?testdata/)

repos:
  - repo: builtin
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  # Lint and format, on the staged files, with the same pins and configs as
  # the Bazel gates.
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        language: system
        entry: .bazel_env/bin/gitleaks git --pre-commit --staged --redact --no-banner --config .gitleaks.toml
        pass_filenames: false
      # The commit message: secrets, then the Conventional Commits header.
      # These run from tbhbdev alpha's plain commit-msg hook, which chains prek's
      # commit-msg stage after the identity check.
      - id: gitleaks-commit-msg
        name: gitleaks (commit message)
        language: system
        entry: bash -c '.bazel_env/bin/gitleaks stdin --redact --no-banner --config .gitleaks.toml < "$1"' --
        stages: [commit-msg]
        always_run: true
      - id: conventional-commits
        name: Conventional Commits
        language: system
        entry: .bazel_env/bin/cog verify --file
        stages: [commit-msg]
        always_run: true
      - id: shfmt
        name: shfmt
        language: system
        entry: .bazel_env/bin/shfmt -w
        types_or: [shell, bats]
      - id: shellcheck
        name: shellcheck
        language: system
        entry: .bazel_env/bin/shellcheck -o check-extra-masked-returns
        types_or: [shell, bats]
      - id: buildifier
        name: buildifier
        language: system
        entry: .bazel_env/bin/buildifier -mode=fix -lint=warn -warnings=all
        types: [bazel]
      - id: tombi-format
        name: tombi format
        language: system
        entry: .bazel_env/bin/tombi format --offline
        types: [toml]
      - id: ryl
        name: ryl
        language: system
        entry: .bazel_env/bin/ryl check --strict -c .ryl.toml
        types: [yaml]
      - id: rumdl
        name: rumdl
        language: system
        entry: .bazel_env/bin/rumdl check
        types: [markdown]
      - id: actionlint
        name: actionlint
        language: system
        # Its run: block checks need shellcheck, so it gets the pinned one.
        entry: env "SHELLCHECK_OPTS=-o check-extra-masked-returns" .bazel_env/bin/actionlint
        args: [-shellcheck, .bazel_env/bin/shellcheck]
        files: ^\.github/workflows/
      - id: editorconfig-checker
        name: editorconfig-checker
        language: system
        entry: .bazel_env/bin/editorconfig-checker -config .editorconfig-checker.json

  # Agent identity, from `tbhbdev alpha identity`. Only stamp-docs runs under
  # prek: `tbhbdev alpha install` installs the trailer, check and consume
  # hooks (prepare-commit-msg, commit-msg, post-commit) as plain git hooks,
  # because prek stashes unstaged changes around every stage and fails a hook
  # when the work tree changes while it runs, which a concurrent agent's edit
  # does.
  #
  # stamp-docs rewrites the staged blob and the work-tree file together, so
  # prek's modified-files check passes. With unstaged edits next to the
  # inserted `generated:` block the work-tree rewrite can conflict: `git add`
  # the whole file or stash first.
  - repo: local
    hooks:
      - id: agent-identity-stamp-docs
        name: agent identity stamp docs
        language: system
        entry: tbhbdev alpha identity stamp-docs
        stages: [pre-commit]
        types: [markdown]
        pass_filenames: false

  # Spelling and prose run before a push, not before a commit: cspell and Vale
  # scan the whole tree, so they cost too much per commit. The hook runs the
  # same Bazel targets as CI, which share its pins and configs, so a word error
  # fails here instead of in CI.
  - repo: local
    hooks:
      - id: spelling-and-prose
        name: cspell and vale
        language: system
        entry: bazelisk test //:cspell_test //:vale_test
        stages: [pre-push]
        always_run: true
        pass_filenames: false
