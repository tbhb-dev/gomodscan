---
default_stages: [pre-commit, pre-push]

# Hooks never touch vendored third-party code; that source is reviewed at PR
# time as part of vendor-check, not reformatted to match this repo's style.
# vendor/ stays out of this global exclusion so the scan hook sees
# vendored dependency changes; each hook that reads files excludes it.
exclude: |
  (?x)^(bin/|dist/|coverage/|tmp/|logs/|spikes/|apm_modules/|\.devtools/|\.config/mise/|\.claude/|\.vale/
  |vendir\.lock\.yml$|apm\.lock\.yaml$)

# Every hook that runs a project tool goes through `mise run <task>`, so
# the hook and the `mise run` gate execute the same pinned binary. The
# devtools block keeps its own `rev:`, pinned by SHA with a `# frozen:`
# tag comment that devtools:check-pins reads and Renovate's pre-commit
# manager tracks.
#
# Install with `mise run devtools:prek-install`, which sets up the
# commit-msg, pre-commit, pre-push, and post-commit stages.

repos:
  - repo: builtin
    hooks:
      - id: check-case-conflict
        exclude: ^vendor/
      - id: check-executables-have-shebangs
        exclude: ^vendor/
      - id: check-merge-conflict
        exclude: ^vendor/
      - id: check-symlinks
        exclude: ^vendor/
      - id: end-of-file-fixer
        exclude: ^vendor/
      - id: fix-byte-order-marker
        exclude: ^vendor/
      - id: mixed-line-ending
        exclude: ^vendor/
      - id: trailing-whitespace
        exclude: ^vendor/

  # The shared hooks: the commit-msg gates, the post-commit hook that deletes
  # the COMMIT_AGENTMSG draft once a commit lands, guard-markdown, and the
  # leak check at three stages. vale-commit-msg and cspell-commit-msg read
  # this repository's .vale.ini and .cspell.jsonc. leaks-staged scans the
  # index blobs, so a private value cannot hide behind a cleaned working
  # file. leaks-pre-push and commit-msg-pre-push only assert that the
  # install-pre-push wrapper sits in front of prek's pre-push hook, because
  # prek hides git's ref lines from its hooks. The published gomodscan hook
  # runs `go tool gomodscan`, and this module has no tool directive for
  # itself, so the local scan hook below runs the scanner from source.
  - repo: https://github.com/tbhb-dev/devtools
    rev: 8dff05b148c3a468dbf0e6e8fb48092bd5cbb418  # frozen: v0.18.0
    hooks:
      - id: commit-trailers
      - id: commitlint
      - id: vale-commit-msg
      - id: cspell-commit-msg
      - id: clear-commit-agentmsg
      - id: guard-markdown
        exclude: ^vendor/
      - id: leaks-staged
        exclude: ^vendor/
      - id: leaks-commit-msg
      - id: leaks-pre-push
      - id: commit-msg-pre-push

  - repo: local
    hooks:
      - id: golangci-lint
        exclude: ^vendor/
        name: golangci-lint
        entry: mise run devtools:lint-go
        language: system
        types: [go]
        pass_filenames: false

      - id: go-fmt
        exclude: ^vendor/
        name: go format check
        entry: mise run lint-go-fmt
        language: system
        types: [go]
        pass_filenames: false

      - id: ryl
        exclude: ^vendor/
        name: ryl
        entry: mise run devtools:lint-yaml
        language: system
        types: [yaml]

      - id: tombi
        name: tombi (TOML lint and format check)
        entry: mise run devtools:lint-toml
        language: system
        types: [toml]
        pass_filenames: false

      - id: mise-fmt
        name: mise fmt --check
        entry: mise run devtools:lint-mise
        language: system
        files: ^(mise\.toml|\.config/mise/conf\.d/.*\.toml)$
        pass_filenames: false

      - id: lint-shell
        name: shellcheck
        entry: mise run devtools:lint-shell
        language: system
        files: ^.*\.sh$
        pass_filenames: false

      - id: lint-shell-fmt
        name: shfmt
        entry: mise run devtools:lint-shell-fmt
        language: system
        files: ^.*\.sh$
        pass_filenames: false

      - id: lint-prose
        exclude: ^vendor/
        name: vale (prose)
        entry: mise run lint-prose
        language: system
        types_or: [markdown, go]

      - id: cspell
        exclude: ^vendor/
        name: cspell
        entry: mise run devtools:lint-spelling
        language: system
        pass_filenames: false

      - id: rumdl
        exclude: ^vendor/
        name: rumdl
        entry: mise run devtools:lint-markdown
        language: system
        types: [markdown]

      - id: biome
        name: biome (JSON lint and format check)
        entry: mise run devtools:lint-config
        language: system
        files: \.(json|jsonc|json5)$
        pass_filenames: false

      - id: actionlint
        name: actionlint
        entry: mise run devtools:lint-workflows
        language: system
        files: ^\.github/workflows/
        pass_filenames: false

      # The vendir drift gate: resync and fail on any difference against
      # what git holds.
      - id: check-vendored
        name: vendir drift check
        entry: mise run devtools:check-vendored
        language: system
        files: ^(vendir\.(yml|lock\.yml)$|\.config/mise/conf\.d/|\.devtools/)
        pass_filenames: false

      - id: check-pins
        name: devtools pin agreement
        entry: mise run devtools:check-pins
        language: system
        files: ^(apm\.yml|vendir\.yml|\.pre-commit-config\.yaml|\.github/renovate\.json5|\.github/workflows/.*)$
        pass_filenames: false

      # Whitespace and indentation against .editorconfig. The task walks the
      # tracked tree itself, so the hook fires on any text file but passes no
      # filenames.
      - id: editorconfig-checker
        name: editorconfig-checker
        entry: mise run lint-editorconfig
        language: system
        types: [text]
        pass_filenames: false

      - id: vendor-check
        name: go mod tidy and vendor drift check
        entry: mise run vendor-check
        language: system
        files: ^(go\.(mod|sum)|vendor/)
        pass_filenames: false

      # gomodscan scans its own vendored modules from source. The hook blocks
      # on findings and on scanner or build failures. Lookup errors only fail
      # the scan once the scanner exits 2 for unevaluated modules.
      - id: scan
        name: gomodscan (self-scan from source)
        entry: mise run scan
        language: system
        files: ^(go\.(mod|sum)|vendor/)
        pass_filenames: false
