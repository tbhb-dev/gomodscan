---
# Import contracts: the command sits on the internal packages. The HTTP
# packages layer as pkgsite and osv over retryhttp, with pkgsite also over
# cachehttp. buildmeta, exitcode, findings, and vendormod are leaves. Every
# package must belong to a component.
version: 3

allow:
  depOnAnyVendor: false
  deepScan: false  # deep scanning runs the go command; the test has none

components:
  cmd: {in: cmd/*}
  buildmeta: {in: internal/buildmeta}
  cachehttp: {in: internal/cachehttp}
  exitcode: {in: internal/exitcode}
  findings: {in: internal/findings}
  osv: {in: internal/osv}
  pkgsite: {in: internal/pkgsite}
  retryhttp: {in: internal/retryhttp}
  vendormod: {in: internal/vendormod}

vendors:
  failsafe: {in: [github.com/failsafe-go/failsafe-go, github.com/failsafe-go/failsafe-go/**]}
  sarif: {in: [github.com/owenrumney/go-sarif/v3, github.com/owenrumney/go-sarif/v3/**]}
  testify: {in: [github.com/stretchr/testify, github.com/stretchr/testify/**]}

# go-arch-lint rejects an empty mayDependOn list, so each leaf lists itself.
# External test packages import their own package, so every component does.
deps:
  cmd:
    mayDependOn: [buildmeta, cachehttp, exitcode, findings, osv, pkgsite, retryhttp, vendormod]
    canUse: [testify]
  buildmeta:
    mayDependOn: [buildmeta]
    canUse: [testify]
  cachehttp:
    mayDependOn: [cachehttp]
    canUse: [testify]
  exitcode:
    mayDependOn: [exitcode]
  findings:
    mayDependOn: [findings]
    canUse: [sarif, testify]
  osv:
    mayDependOn: [osv, retryhttp]
    canUse: [testify]
  pkgsite:
    mayDependOn: [cachehttp, pkgsite, retryhttp]
    canUse: [testify]
  retryhttp:
    mayDependOn: [osv, retryhttp]
    canUse: [failsafe, testify]
  vendormod:
    mayDependOn: [vendormod]
    canUse: [testify]
