[global]
disable = [
  "MD013",  # Line length — we don't hardwrap markdown.
]
respect_gitignore = true
exclude = [
  ".git",
  ".vale",
  "tmp",
  "LICENSE",
]

[MD003]
style = "atx"

[MD004]
style = "dash"

[MD025]
front_matter_title = ""

[MD048]
style = "backtick"

# OKF index files require `* [Title](link) - description` entries, so the
# star marker is part of the format there, not a style choice.
[per-file-ignores]
# cog writes CHANGELOG.md: it repeats version headings (MD024) and puts the
# release marker directly under the separator rule (MD065).
"CHANGELOG.md" = ["MD024", "MD065"]
"**/index.md" = ["MD004"]
# A PR body has no H1: GitHub shows the PR title above it.
".github/PULL_REQUEST_TEMPLATE.md" = ["MD041"]
