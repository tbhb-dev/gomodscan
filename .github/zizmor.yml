---
# Every action must be pinned to a full commit SHA, not a tag or branch.
# zizmor's default lets first-party actions use a ref pin; the wildcard here
# removes that exemption.
rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
  # tbhb-dev/renovate-config and tbhb-dev/rules are pinned by commit to their
  # main branches, which have no release tags by design; Renovate bumps the
  # pins. The two Renovate caller workflows and ci.yml reference them. Each
  # move of a branch leaves the `# main` comment naming a newer commit until
  # Renovate's bump merges, which is Renovate's job to catch, not a failure
  # for every pull request.
  stale-action-refs:
    ignore:
      - ci.yml
      - renovate.yaml
      - renovate-config-validator.yaml
  ref-version-mismatch:
    ignore:
      - ci.yml
      - renovate.yaml
      - renovate-config-validator.yaml
  # Off until actionlint accepts GitHub's `$/` self-repository syntax
  # (actionlint issue 711), which zizmor asks for in place of `./`; then
  # bump actionlint and switch every local `uses:` to `$/`.
  self-repository:
    disable: true
