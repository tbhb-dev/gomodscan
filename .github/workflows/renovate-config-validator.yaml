---
# PR gate for the Renovate config: strict validation plus a check that the
# pinned preset references resolve.
name: Validate Renovate configuration

on:
  pull_request:
    paths:
      - ".github/renovate.json5"
      - ".github/workflows/*.yaml"
      - ".github/workflows/*.yml"
      - "MODULE.bazel"
      - "**/*.bzl"

permissions:
  contents: read

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: tbhb-dev/renovate-config/.github/workflows/renovate-config-validator.yaml@a4217a7c162ed39216b343f85e48f712665a93a8  # main
    with:
      configs: .github/renovate.json5
