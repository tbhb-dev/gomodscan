---
# Main quality gate. Bazel pins every tool and owns every gate: the
# hermetic checks are cached `bazel test` targets, so `bazel test //...`
# runs them all, and the few that need the network, Git history or the
# GitHub API run as their own steps after it. A final `conclusion` job gives
# branch protection one stable required check.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Bazel 9.x only, the version .bazelversion pins, on Linux (x86_64 and
  # arm64), macOS (arm64) and Windows (x86_64). The checks that need the
  # network or GitHub's API run on Linux only; they do not depend on the OS.
  bazel:
    name: "bazel (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, windows-2025]
        include:
          - os: ubuntu-26.04
            release: release
          - os: ubuntu-26.04-arm
            release: release
          - os: macos-26
            release: release
          # Bazel runs the workspace status command without a shell on
          # Windows, so the release config there uses the batch script.
          - os: windows-2025
            release: release-windows
    defaults:
      run:
        shell: bash
    steps:
      # harden-runner monitors Linux runners only.
      - name: Harden the runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      # Full history: the release build stamps the version through
      # `git describe`.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # On Windows the rules' scripts run under the shell toolchain's Bash,
      # MSYS2's on the hosted image. Only there: elsewhere Bazel would run
      # genrule commands with it too.
      - name: Point Bazel at Bash
        if: runner.os == 'Windows'
        run: echo 'BAZEL_SH=C:/msys64/usr/bin/bash.exe' >>"$GITHUB_ENV"

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3  # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      # Some runfiles paths pass Windows' 260-character limit under the
      # default output root in the runner's profile. The user bazelrc reaches
      # every workspace the job tests. After setup-bazel, which writes that file
      # too and leaves its last line unterminated, hence the leading newline.
      - name: Shorten Bazel's output root
        if: runner.os == 'Windows'
        run: printf '\nstartup --output_user_root=C:/b\n' >>"$HOME/.bazelrc"

      # Even under that root, a few paths in the Python runtime's packages
      # pass 260 characters; Python reads them only with long paths enabled.
      - name: Enable long paths
        if: runner.os == 'Windows'
        run: reg add 'HKLM\SYSTEM\CurrentControlSet\Control\FileSystem' //v LongPathsEnabled //t REG_DWORD //d 1 //f

      # Fetching hits go.dev's release list (go_sdk.from_file), PyPI, GitHub
      # and the BCR mirror, which can fail for longer than Bazel's own
      # download retries wait. Only the fetch is retried: a test failure never
      # is.
      - name: Fetch, retrying transient failures
        run: |
          for attempt in 1 2 3; do
            bazelisk fetch --config=ci //... && break
            if ((attempt == 3)); then exit 1; fi
            sleep 60
          done

      # //... is every hermetic gate: the whole-tree lint tests (secrets in
      # the working tree, YAML, TOML, Markdown, prose, EditorConfig,
      # workflows, shell, CODEOWNERS paths), the format check, Starlark
      # lint, nogo during the build, the Go and Python tests and linters,
      # condition coverage, the docs bundle and REUSE checks, the import
      # contracts, and the preset staleness test.
      - name: Test
        run: bazelisk test --config=ci //...

      - name: Build the release binary
        env:
          RELEASE_CONFIG: ${{ matrix.release }}
        run: bazelisk build "--config=${RELEASE_CONFIG}" //cmd/gomodscan

      # A failed run's test logs, so a failure that does not recur can still
      # be read.
      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: testlogs-${{ matrix.os }}
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml
          if-no-files-found: ignore

  # The repository-level checks, on Linux beside the bazel matrix, so they
  # don't wait behind the tests.
  repo:
    name: repo
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # gitleaks scans the whole history, so it needs every commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3  # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      - name: Check that gazelle has nothing to change
        run: bazelisk run //:gazelle -- -mode=diff

      - name: Check that MODULE.bazel is tidy
        run: |
          bazelisk mod tidy
          git diff --exit-code -- MODULE.bazel

      # Git history is not a declared input, so the history scan runs
      # outside the test graph; //:gitleaks_test covers the working tree.
      - name: Scan Git history for secrets
        run: bazelisk run //:gitleaks_history

      # Advisories change without any input changing, so the audit is never
      # a cached test.
      - name: Audit the locked Python dependencies
        run: bazelisk run //tools:pip_audit

      # //:zizmor_test runs the offline audits; a token turns on the online
      # ones, which need the network.
      - name: Audit workflow security online
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bazelisk run @tbhb_rules_zizmor//:zizmor --
          --persona pedantic --no-progress "${GITHUB_WORKSPACE}/.github"

      # //:codeowners_test checks that every pattern matches a path; owner
      # and syntax validation needs GitHub's API.
      - name: Check CODEOWNERS owners and syntax
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          errors="$(gh api \
            "repos/${GITHUB_REPOSITORY}/codeowners/errors?ref=${HEAD_SHA}" \
            --jq '.errors')"
          count="$(printf '%s' "${errors}" | jq 'length')"
          if [ "${count}" -ne 0 ]; then
            echo "::error::CODEOWNERS has ${count} owner or syntax error(s):"
            printf '%s' "${errors}" |
              jq -r '.[] | "  line \(.line): \(.kind): \(.message)"'
            exit 1
          fi

  # Reachable vulnerabilities. Advisories change without any input changing,
  # so the test is manual and never cached; this job runs it by name and
  # uploads the SARIF report it writes to Code Scanning, whether or not the
  # scan found anything.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # upload the SARIF report to Code Scanning
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3  # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      - name: Scan for reachable vulnerabilities
        run: bazelisk test --config=ci //:govulncheck_test

      - name: Upload the govulncheck SARIF
        if: "!cancelled()"
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: bazel-testlogs/govulncheck_test/test.outputs/govulncheck.sarif
          category: govulncheck

  # gomodscan scans its own vendored modules, built from source so the scan
  # exercises the code under review. The repository does not vendor, so a
  # scratch copy of the module gets `go mod vendor` first. Exit status 1 means
  # findings, which Code Scanning shows; any other nonzero status fails the job.
  gomodscan:
    name: gomodscan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # upload the SARIF report to Code Scanning
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3  # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      - name: Vendor the module in a scratch copy
        run: |
          scratch="${RUNNER_TEMP}/vendored"
          mkdir "${scratch}"
          cp -R go.mod go.sum cmd internal "${scratch}/"
          bazelisk run --config=ci @rules_go//go -- -C "${scratch}" mod vendor

      - name: Run gomodscan (SARIF)
        run: |
          status=0
          bazelisk run --config=ci //cmd/gomodscan -- \
            -modroot "${RUNNER_TEMP}/vendored" \
            -format sarif -o "${GITHUB_WORKSPACE}/gomodscan.sarif" || status=$?
          if ((status > 1)); then exit "${status}"; fi

      - name: Upload the gomodscan SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: gomodscan.sarif
          category: gomodscan

  # One stable required check for branch protection. `if: always()` runs it
  # even when a needed job failed. It passes only when every needed job's
  # result is exactly "success", so a gate that was skipped, cancelled or
  # never finished cannot pass. A matrix with a cancelled leg reports
  # "abandoned", not "cancelled", so the check lists what passes, not what
  # fails.
  conclusion:
    name: conclusion
    if: always()
    needs: [bazel, repo, govulncheck, gomodscan]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Fail if any needed job did not succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if ! jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null; then
            echo "A required job did not succeed." >&2
            exit 1
          fi
