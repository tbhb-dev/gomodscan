---
# Main quality gate. Runs the full lint set, the test suite
# (matrixed across linux/macOS/windows native runners with the race
# detector enabled in every slot), the coverage thresholds, govulncheck,
# and the vendor-drift check on every pull request and every push to
# `main`. Each gate runs as its own job so a flake in one block does not
# require rerunning the others and the PR status surfaces which gate
# fired.
# Each matrix slot also uploads its own coverage report to GitHub's
# code coverage API, and a downstream `coverage` job merges the slots
# into one combined report.
#
# The toolchain comes from a SHA-pinned jdx/mise-action reading
# mise.toml, the conf.d drop-ins, and the committed lockfiles, so every
# job runs the pinned binaries. Each job then invokes the matching mise
# task so the task stays the single source of truth for
# what the gate runs. The local `check` and `check-all` aggregators stay
# in lockstep with this workflow.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A lockfile only binds a version it has already seen: moving a pin in
# mise.toml while leaving mise.lock alone would make mise fetch the new
# version and rewrite the lockfile in place, so a Renovate PR could pass
# while the committed digests drifted from the pins under review.
# MISE_LOCKED makes that a hard failure instead.
env:
  MISE_LOCKED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Invokes only the `lint` aggregator task, so the job stays unchanged
  # as new gates come in — each gate appends itself to the aggregator
  # instead. The full toolchain installs from the lockfiles, go
  # included. The conf.d go pin is newer than go.mod's toolchain
  # directive, so Go runs the pinned toolchain rather than fetching one.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # Full history: the leak scan below reads every commit a pull
      # request adds, and a shallow clone is refused as incomplete.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9

      # mise installs the vale binary but does not fetch the style
      # packages .vale.ini declares.
      - name: Sync Vale styles
        run: mise run install-tools

      - name: Check private identifiers in the PR range
        if: github.event_name == 'pull_request'
        env:
          LEAK_BASE: ${{ github.event.pull_request.base.sha }}
          LEAK_HEAD: ${{ github.event.pull_request.head.sha }}
        run: mise run --quiet devtools:lint-leaks -- --range "$LEAK_BASE..$LEAK_HEAD"

      - name: Run lint gates
        run: mise run lint

  test-matrix:
    name: "test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    # Each slot publishes its own coverage report to GitHub's code
    # coverage API, which needs code-quality: write on top of the read
    # scopes (contents for checkout, pull-requests so the upload action
    # can resolve the PR number on push events). Job-level permissions
    # replace the workflow default, so the reads are listed explicitly.
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - windows-2025
    steps:
      - name: Harden the runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise supplies go on every slot, Windows included: a probe on
      # windows-2025 showed it running a bash-shebang task body under
      # Git Bash and resolving its own go pin there, which is what
      # retired the actions/setup-go step this job used to run. The pin
      # is locked for windows-x64, so this installs the same toolchain
      # MISE_LOCKED enforces everywhere else.
      #
      # The first `mise run` in a job otherwise installs the whole
      # configured toolchain rather than the task's own tools, which cost
      # the probe over three minutes against roughly one of real work.
      # Turning the auto-install off leaves install_args as the single
      # place naming what this job needs.
      - name: Set up mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9
          install_args: go

      - name: Run tests with coverage
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run cover-go-binary

      - name: Run tests with race detector
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run test-go-race

      # Publish this slot's report under a per-OS label so each platform
      # shows on its own, and stash the binary coverage data for the
      # coverage job to merge into the combined report.
      - name: Upload ${{ matrix.os }} coverage report
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: coverage.xml
          language: Go
          label: code-coverage/${{ matrix.os }}
          fail-on-error: false

      - name: Upload ${{ matrix.os }} coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: covdata-${{ matrix.os }}
          path: coverage.covdata
          if-no-files-found: error
          retention-days: 1

  # The matrix job reports as `test (<os>)` per slot. This job owns the
  # plain name `test`, so the required-check list names one check and stays
  # stable when the matrix changes. `if: always()` keeps it running after a
  # failed slot, and anything but `success` -- failure, cancelled, or
  # skipped -- fails it.
  test:
    name: test
    if: always()
    needs: test-matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Require every matrix leg to pass
        env:
          RESULT: ${{ needs.test-matrix.result }}
        run: |
          if [[ "${RESULT}" != "success" ]]; then
            echo "the test matrix finished as ${RESULT}" >&2
            exit 1
          fi

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    needs: test-matrix
    # Publishes the merged report to the code coverage API (same scopes
    # as the per-slot uploads in the test job).
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9
          install_args: go

      - name: Download per-slot coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: coverage.covdata.slots
          pattern: covdata-*

      - name: Merge coverage and render the combined report
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run cover-go-merge

      - name: Upload combined coverage report
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: coverage.xml
          language: Go
          label: code-coverage/combined
          fail-on-error: false

  # Enforces the .testcoverage.yml thresholds, which the per-slot
  # cover-go-binary runs above only measure. The floors were measured on
  # Linux.
  cover-go-check:
    name: cover-go-check
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9
          install_args: go

      - name: Measure Go coverage and enforce the thresholds
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run cover-go

  vuln:
    name: vuln
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9
          install_args: go

      - name: Run govulncheck
        run: mise run vuln

  vendor-check:
    name: vendor-check
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9
          install_args: go

      - name: Check vendor drift
        run: mise run vendor-check
