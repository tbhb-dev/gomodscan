---
# Self-hosted Renovate. Authenticates as the tbhb-dev-renovate[bot]
# GitHub App so commits get a DCO sign-off matching the committer (the
# stock Mend hosted App commits as renovate[bot], which can't match this
# repo's gitAuthor + gitSignOff pair).
#
# Delegates to the shared reusable workflow in tbhb-dev/devtools,
# which mints the App token, checks out this repo, and runs the pinned
# Renovate image against this repo's .github/renovate.json5. Pinned by commit
# SHA; the trailing tag comment marks the matching release for Renovate.
#
# Execution depends on the tbhb-dev-renovate App credentials reaching the
# run: RENOVATE_CLIENT_ID and RENOVATE_PRIVATE_KEY must be Actions secrets
# visible to this repository, and the App must be installed on it.
#
# This workflow runs on a schedule and on demand only. A push or pull
# request trigger would start a Renovate run, with the App credentials, for
# every change to the repository.
name: Renovate

on:
  schedule:
    # Hourly on weekdays, every two hours on weekends. Matches Cilium's
    # cadence: fast enough to catch CVEs the same business day, slack
    # enough to avoid wasting API budget on quiet weekends.
    - cron: "0 * * * 1-5"
    - cron: "0 */2 * * 6,0"
  workflow_dispatch:
    inputs:
      renovate_log_level_debug:
        type: boolean
        description: "Run Renovate with debug log levels"
        default: true

permissions:
  contents: read

jobs:
  renovate:
    permissions:
      contents: read
    # yamllint disable-line rule:line-length
    uses: tbhb-dev/devtools/.github/workflows/renovate.yaml@1dde4f53da5fcbee3876dc2cb67da59e52b63479 # v0.15.0
    with:
      renovate_log_level_debug: ${{ inputs.renovate_log_level_debug || false }}
    secrets:
      RENOVATE_CLIENT_ID: ${{ secrets.RENOVATE_CLIENT_ID }}
      RENOVATE_PRIVATE_KEY: ${{ secrets.RENOVATE_PRIVATE_KEY }}
