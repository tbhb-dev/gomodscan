# Review edits to this file as security policy. The rules wrapper supplies the
# base ruleset, so allowlist only what is justified, each with a reason.

# `gitleaks dir` walks the working directory without reading .gitignore, so
# the build output and tool caches that a local checkout holds would be
# scanned too. None of them is authored content, and none is tracked by git,
# so the history scan never sees them either.
[[allowlists]]
description = "Untracked build output, tool caches, and scratch space"
paths = [
  '''^\.venv/''',
  '''^bazel-[^/]+/''',
  '''^\.bazel-[^/]+/''',
  '''^\.mise/''',
  '''^\.vale/(Google|write-good|proselint|ai-tells[^/]*)/''',
  '''^tmp/''',
  '''^\.worktrees/''',
  '''(^|/)__pycache__/''',
  '''^\.(ruff|pytest|hypothesis|rumdl)_cache/''',
]

# The vendor tree holds third-party module source that `go mod vendor` copies
# verbatim. The generic-api-key rule matches identifier names such as
# amzSignedHeadersKey in it. Each module's own review covers its content, and
# the vendor fixtures under internal/ stay scanned.
[[allowlists]]
description = "Vendored third-party module source"
paths = [
  '''^vendor/''',
]
