# Repository policy for the agent-commit, agent-pr, and agent-merge-pr
# skills that the devtools packages deploy. Each line is `key = value`;
# the reader never sources this file, and rejects unknown keys, duplicates,
# and symlinks. The reviewer, GitHub account, required reviewer, merge
# owner, and delegation come from the machine, never from this file.

# The commit-msg gates, as the repository runs them.
lint_commit_cmd = mise run lint-commit-msg

# The same gates for a squash message in SQUASH_AGENTMSG. An empty value
# refuses every review and merge.
lint_squash_cmd = mise run lint-squash-msg

# The label that sends a pull request to the owner.
owner_review_label = owner-review

# Where the repository keeps its ruleset files. The merge reads the checks
# the base branch requires from those files, beside the rulesets GitHub
# applies.
ruleset_dir = .github/rulesets

# The ignored paths that a merged branch's worktree may hold and still go:
# caches anything can regenerate, Vale's synced styles, and the agent
# drafts that a commit, a publish, or a merge consumed.
# gomodscan adaptation: allow regenerable Go build, release, coverage, and
# mutation outputs. Fuzz crashers under testdata/fuzz stay out: they are
# evidence, not cache.
disposable_ignored = ^(bin|dist|coverage|node_modules|apm_modules|\.rumdl_cache|\.fix-prose|\.gremlins)/|^gomodscan$|^gremlins-report[.]json$|^coverage[.](out|html|txt|xml)$|^coverage[.]covdata[^/]*(/|$)|^\.vale/|^\.cspell-cache$|(^|/)\.DS_Store$|^(COMMIT_AGENTMSG|PR_AGENTDESC\.md|SQUASH_AGENTMSG)$

# Golden files and test baselines: any testdata tree, which includes the
# fuzz seed corpora a test reads.
golden_paths = (^|/)testdata/

# What the merge reads as a loosened gate: suppression markers in an added
# line's trailing comment, lowercase.
# gomodscan adaptation: read Go suppressions, coverage annotations, and coverage floor edits as loosening
loosening_markers = noqa|cspell: *(ignore|disable|words)|vale +off|<!-- *vale [a-z0-9.]+ *= *no|shellcheck +disable|rumdl-disable|markdownlint-disable|nolint|//go:build.*[[:space:](]ignore([^a-z0-9_]|$)|t[.]skip(now)?[(]|#nosec|//lint:ignore|coverage-ignore|^[[:space:]]*(file|package|total):[[:space:]]*[0-9]

# The gate and lint configuration files, where an added exclusion or a
# removed hook counts as loosening.
# gomodscan adaptation: treat the Go gate configuration files, the
# editorconfig gate, the actionlint config, and the leak skip list as gate paths
gate_config_paths = ^([.]pre-commit-config[.]yaml|[.]shellcheckrc|[.]cspell.*|[.]rumdl[.]toml|[.]vale[.]ini|[.]vale/.*|[.]yamllint.*|[.]editorconfig|[.]editorconfig-checker[.]json|mise[.](toml|lock)|[.]config/mise/.*|[.]gitleaks[.]toml|[.]leak-(allow|patterns)|[.]leak-skip|[.]github/workflows/.*|[.]github/rulesets/.*|[.]github/actionlint[.]yaml|go[.](mod|sum)|[.]golangci[.]yml|[.]go-arch-lint[.]yml|[.]testcoverage[.]yml|[.]gremlins[.]yaml|biome[.]jsonc?|tombi[.]toml)$

# The git hooks a commit needs, and the line that marks each one as the
# repository's own. prek writes this line into each hook it installs.
required_hooks = commit-msg pre-commit post-commit
hook_marker = File generated by prek

# How many times a review may return findings. Past this bound the review
# stops and stamps nothing.
review_max_rounds = 3

# The checks on a pull request description. The lint is the repository's
# own. Each item under Related matches the pattern. The repository has no
# title check beyond the shape the shared validator already enforces.
pr_template = .github/pull_request_template.md
lint_pr_cmd = mise run lint-pr-description
pr_log_entry = optional
pr_related_pattern = ^#[0-9]+$
pr_title_check_cmd =

# Where reports go. A repository without a mailbox leaves these empty,
# and the scripts print each report instead.
mail_cmd =
mail_to =
mail_from =

# Paths whose changes go to the owner: the gate and lint configuration,
# the toolchain pins and the vendored payload, the manifests that deploy
# the agent primitives, the rest of .github/, AGENTS.md, and the agent
# skills themselves. The merge lists the ones a pull request changes in
# its report and does not refuse.
# gomodscan adaptation: treat the Go module, the vendored dependencies, the
# release config, the tool configuration files, and the leak skip list as
# owner paths, because this is a supply-chain tool
owner_paths = ^(AGENTS[.]md$|CLAUDE[.]md$|mise[.](toml|lock)$|mise[.]local[.]toml[.]example$|apm|vendir|cog[.]toml$|[.]shellcheckrc$|[.]pre-commit-config[.]yaml$|[.]config/mise/|[.]devtools/|[.]cspell|[.]rumdl|[.]yamllint|[.]editorconfig|[.]vale[.]ini$|[.]vale/|[.]claude/|[.]agents/|[.]codex/|[.]gitleaks[.]toml$|[.]leak-(allow|patterns)$|[.]leak-skip$|biome[.]jsonc?$|tombi[.]toml$|[.]github/|go[.](mod|sum)$|vendor/|[.]golangci[.]yml$|[.]go-arch-lint[.]yml$|[.]testcoverage[.]yml$|[.]gremlins[.]yaml$)

# An optional readiness command. An empty value adds no readiness check.
merge_ready_cmd =
